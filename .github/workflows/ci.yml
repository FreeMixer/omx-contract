name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: handback-install
        name: Install the one runtime dependency
        run: npm ci
      - id: handback-validate
        name: The data is valid and in the one formatting
        run: |
          node bin/omx-contract.mjs validate
          node bin/omx-contract.mjs fmt --check
      - id: handback-render
        name: The committed renders are the render of the data
        run: |
          node bin/omx-contract.mjs render --target c --out include --check
          node bin/omx-contract.mjs render --target json --out share/omx-contract --check
          node bin/omx-contract.mjs render --target ts --out test/golden/ts --check
      - id: handback-test
        name: Tests (schema, semantic checks, goldens, perturbation, semver, round trip)
        run: npm test
      - id: handback-round-trip
        name: The round-trip proof against omx-dsp v0.1.3's headers (spec 4.4 steps 1 and 2)
        run: node tools/proof/round-trip.mjs --quiet
      - id: handback-headers
        name: The headers compile with no node (what a release build runs)
        run: make check
