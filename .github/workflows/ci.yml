name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # the private development copy runs on FreeMixer's own runners (hosted runners are refused there); the public
    # repository runs on GitHub's
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: handback-install
        name: Install the one runtime dependency
        run: npm ci
      - id: handback-validate
        name: The data is valid and in the one formatting
        run: |
          node bin/omx-contract.mjs validate
          node bin/omx-contract.mjs fmt --check
      - id: handback-render
        name: The committed renders are the render of the data
        run: |
          node bin/omx-contract.mjs render --target c --out include --check
          node bin/omx-contract.mjs render --target json --out share/omx-contract --check
          node bin/omx-contract.mjs render --target lv2 --out share/omx-contract --check
          node bin/omx-contract.mjs render --target ts --out test/golden/ts --check
      - id: handback-contract-dir
        name: The data installed as the contract directory renders the same bytes, and its links hold
        run: |
          make install DESTDIR="$RUNNER_TEMP/inst" PREFIX=/usr DATADIR=/usr/share INCLUDEDIR=/usr/include
          dir="$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d"
          node bin/omx-contract.mjs validate --contract-dir "$dir"
          node bin/omx-contract.mjs fmt --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target c --out include --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target json --out share/omx-contract --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target lv2 --out share/omx-contract --check --contract-dir "$dir"
          node bin/omx-contract.mjs render --target ts --out test/golden/ts --check --contract-dir "$dir"
          node bin/omx-contract.mjs links --check
      - id: handback-verbs
        name: A package's verbs, installed beside the data, validate and render the committed fixture headers
        run: |
          vdir="$RUNNER_TEMP/verbs"
          cp -r "$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d" "$vdir"
          sh tools/install-contract-dir.sh verbs-fixture 1.0.0 3 test/fixtures/package-verbs "$vdir" data
          node bin/omx-contract.mjs validate --contract-dir "$vdir"
          node bin/omx-contract.mjs fmt --check --contract-dir "$vdir"
          node bin/omx-contract.mjs render --target c --package verbs-fixture --contract-dir "$vdir" --out test/golden/verbs/c --check
          node bin/omx-contract.mjs render --target c --contract-dir "$vdir" --out "$RUNNER_TEMP/verbs-c"
          cmp "$RUNNER_TEMP/verbs-c/omxcontract/omx_host_verbs.h" test/golden/verbs/omx_host_verbs.h
      - id: handback-installed-cli
        name: The installed omx-contract command, with its vendored dependencies only, reads the installed directory
        run: |
          make install-cli DESTDIR="$RUNNER_TEMP/inst" PREFIX=/usr DATADIR=/usr/share
          cli="$RUNNER_TEMP/inst/usr/lib/omx-contract/bin/omx-contract.mjs"
          dir="$RUNNER_TEMP/inst/usr/share/omx-contract/contract.d"
          cd "$RUNNER_TEMP"
          node "$cli" validate --contract-dir "$dir"
          node "$cli" render --target json --out "$RUNNER_TEMP/cli-json" --contract-dir "$dir"
          cmp "$RUNNER_TEMP/cli-json/omx-contract.json" "$GITHUB_WORKSPACE/share/omx-contract/omx-contract.json"
      - id: handback-test
        name: Tests (schema, semantic checks, goldens, perturbation, semver, round trip)
        run: npm test
      - id: handback-layout
        name: Every word in the file its rule places it; every installed LV2 and CLAP term mapped with a status
        run: make layout
      - id: handback-completeness
        name: Every kernel has every artifact of the kernel recipe, its values cited from the engine
        run: make completeness
      - id: handback-public-sources
        name: No tracked file points into a private repository, branch, issue or path
        run: make public-sources
      - id: handback-private-refs
        name: The shared private-refs gate agrees, and each sabotage goes red
        run: make private-refs
      - id: handback-round-trip
        name: The round-trip proof against omx-dsp v0.1.3's headers (spec 4.4 steps 1 and 2)
        run: node tools/proof/round-trip.mjs --quiet
      - name: Install the C toolchain where the runner has none (arc-freemixer's image carries no make or cc)
        run: |
          command -v make >/dev/null && command -v cc >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends make gcc libc6-dev
          }
      - id: handback-headers
        name: The headers compile with no node (what a release build runs)
        run: make check

  # The packages of a release, built as the release builds them (FreeMixer/.github's build-rpm and build-deb actions),
  # each file held to the package it belongs in (tools/package-files.sh, BUILDING.md), and the command run on the
  # installed data with no development package.
  rpm:
    name: RPMs (fc44), which file lands in which package
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build dnf5-plugins
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/build-rpm@v1
      - id: handback-rpm-files
        name: Which file lands in which package
        run: sh tools/package-files.sh rpm rpms
      - id: handback-rpm-runtime
        name: The command reads the installed contract directory with omx-contract-data and no development package
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False rpms/omx-contract-[0-9]*.noarch.rpm rpms/omx-contract-data-[0-9]*.noarch.rpm
          if rpm -q omx-contract-devel; then echo '::error::the development package came along'; exit 1; fi
          omx-contract validate --contract-dir /usr/share/omx-contract/contract.d
          omx-contract render --target json --contract-dir /usr/share/omx-contract/contract.d --out /tmp/json
          cmp /tmp/json/omx-contract.json /usr/share/omx-contract/omx-contract.json

  deb:
    name: DEBs (${{ matrix.suite }}), linted, which file lands in which package
    runs-on: ${{ github.event.repository.private && 'arc-freemixer' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    defaults:
      run:
        shell: bash
    container:
      image: debian:${{ matrix.suite }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev debhelper build-essential lintian
      - uses: actions/checkout@v4
      - uses: FreeMixer/.github/.github/actions/build-deb@v1
      - id: handback-deb-files
        name: Which file lands in which package
        run: sh tools/package-files.sh deb debs
      - id: handback-deb-runtime
        name: The command reads the installed contract directory with omx-contract-data and no development package
        run: |
          set -eu
          apt-get install -y --no-install-recommends ./debs/omx-contract_*_all.deb ./debs/omx-contract-data_*_all.deb
          if dpkg -s libomx-contract-dev; then echo '::error::the development package came along'; exit 1; fi
          omx-contract validate --contract-dir /usr/share/omx-contract/contract.d
          omx-contract render --target json --contract-dir /usr/share/omx-contract/contract.d --out /tmp/json
          cmp /tmp/json/omx-contract.json /usr/share/omx-contract/omx-contract.json

  # A commit message is published like a file. A pull request's own commits must carry no
  # AI-attribution line (tools/ai-trace-commit-check.sh); what is already on the base is not read.
  ai-trace:
    name: commit messages carry no AI attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: The checker catches a fixture and goes blind when its patterns are removed
        run: tools/ai-trace-commit-check.sh --selftest
      - name: Scan the commits of the pull request
        run: tools/ai-trace-commit-check.sh origin/${{ github.event.pull_request.base.ref }}..HEAD
